<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4a90e2">
    <link rel="manifest" href="manifest.json">
    <title>Controle de Remédios</title>
    
    <!-- Toastify CSS (Alertas Elegantes) -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --subtext: #666666;
            --border: #e0e0e0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* --- HEADER & CONTAINER --- */
        header { 
            width: 100%; 
            background: var(--card-bg); 
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 16px 20px; 
            box-sizing: border-box; 
            position: sticky;
            top: 0;
            z-index: 90;
        }
        header h1 { 
            margin: 0; 
            font-size: 20px; 
            color: var(--primary); 
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }
        .menu-btn { 
            background: #f0f4f9; 
            border: none; 
            font-size: 20px; 
            cursor: pointer; 
            color: var(--primary); 
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
        }
        .menu-btn:active { background: #e1e8f0; }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px; box-sizing: border-box; }

        /* --- NOTIFICATION BANNER --- */
        .notify-banner { 
            background: linear-gradient(135deg, #fff9e6, #fff3cd); 
            border: 1px solid #ffeeba; 
            color: #856404; 
            padding: 14px 16px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            font-size: 13px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .btn-notify-active { 
            background: var(--warning); 
            color: white; 
            border: none; 
            padding: 8px 14px; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s;
        }

        /* --- DRAWER (MENU LATERAL) --- */
        .drawer-overlay { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.4); 
            backdrop-filter: blur(4px);
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s ease; 
            z-index: 100; 
        }
        .drawer-overlay.active { opacity: 1; pointer-events: auto; }
        .drawer { 
            position: fixed; 
            top: 0; 
            right: -320px; 
            width: 310px; 
            height: 100%; 
            background: white; 
            transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
            padding: 24px 20px; 
            box-sizing: border-box; 
            z-index: 101; 
            overflow-y: auto; 
            box-shadow: -5px 0 25px rgba(0,0,0,0.15);
        }
        .drawer-overlay.active .drawer { right: 0; }

        /* --- TABS & FORMULÁRIOS --- */
        .tabs { display: flex; gap: 6px; margin-bottom: 24px; background: #f0f2f5; padding: 4px; border-radius: 10px; }
        .tab-btn { 
            flex: 1; 
            padding: 10px 4px; 
            border: none; 
            background: transparent; 
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 13px; 
            color: var(--subtext);
            transition: 0.2s ease;
        }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.08); }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #444; }
        input[type="text"], input[type="time"], select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            box-sizing: border-box; 
            background: #fdfdfd; 
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15); }

        .btn { width: 100%; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-add { background-color: var(--primary); box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3); }
        .btn-add:hover { background-color: var(--primary-hover); }
        .btn-sync { background-color: #27ae60; box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3); margin-top: 10px; }

        .photo-options { display: flex; gap: 8px; margin-bottom: 8px; }
        .btn-photo { 
            flex: 1; 
            padding: 10px; 
            border: 1px dashed var(--primary); 
            background: #f0f7ff; 
            color: var(--primary); 
            border-radius: 10px; 
            font-weight: 600; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            font-size: 13px; 
            transition: 0.2s;
        }
        .btn-photo:hover { background: #e3f0ff; }

        .photo-preview { display: none; margin-top: 10px; position: relative; width: 100%; height: 130px; border-radius: 10px; overflow: hidden; border: 1px solid #ddd; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .btn-remove-photo { position: absolute; top: 8px; right: 8px; background: rgba(231, 76, 60, 0.9); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* --- LISTA DE REMÉDIOS --- */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--subtext); font-size: 14px; }
        .empty-state-icon { font-size: 48px; margin-bottom: 10px; display: block; opacity: 0.7; }

        .med-item { 
            display: flex; 
            align-items: center; 
            background: var(--card-bg); 
            padding: 14px 16px; 
            border-radius: 14px; 
            margin-bottom: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            border: 1px solid #f0f0f0;
            transition: 0.2s ease;
        }
        .med-item.taken { opacity: 0.6; background: #fdfdfd; }
        .med-img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; margin-right: 14px; cursor: pointer; background: #eef2f5; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .taken .med-img { cursor: default; }
        .med-info { flex-grow: 1; }
        .med-info b { font-size: 15px; color: var(--text); display: block; margin-bottom: 2px; }
        .med-info span { font-size: 12px; color: var(--subtext); font-weight: 500; }
        
        .btn-mini { padding: 9px 14px; font-size: 13px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; background: #e8ecf1; color: var(--text); margin-left: 6px; transition: 0.2s; }
        .btn-mini:hover { filter: brightness(0.95); }
        .taken .btn-mini { background: #e8f8f0; color: var(--success); }

        /* --- MODAIS DE CONFIRMAÇÃO E IMAGEM --- */
        .image-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; z-index: 300; transition: 0.3s; }
        .image-modal.active { opacity: 1; pointer-events: auto; }
        .image-modal img { max-width: 90%; max-height: 80vh; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .confirm-modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; z-index: 200; transition: 0.3s; }
        .confirm-modal-overlay.active { opacity: 1; pointer-events: auto; }
        .confirm-modal { background: white; padding: 24px; border-radius: 18px; width: 85%; max-width: 340px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .confirm-modal h3 { margin: 0 0 8px 0; font-size: 18px; color: var(--text); }
        .confirm-modal p { color: var(--subtext); font-size: 14px; margin: 0 0 20px 0; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-yes { background: var(--success); color: white; box-shadow: 0 3px 8px rgba(46, 204, 113, 0.3); }
        .btn-no { background: #f0f2f5; color: var(--text); }
        .btn-danger-confirm { background: var(--danger); color: white; box-shadow: 0 3px 8px rgba(231, 76, 60, 0.3); }

        /* --- CUSTOMIZAÇÃO DAS NOTIFICAÇÕES TOASTIFY --- */
        .toastify {
            border-radius: 10px !important;
            padding: 12px 18px !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15) !important;
            display: flex !important;
            align-items: center !important;
            gap: 8px !important;
        }
        .toast-success { background: linear-gradient(135deg, #27ae60, #2ecc71) !important; }
        .toast-error { background: linear-gradient(135deg, #c0392b, #e74c3c) !important; }
        .toast-warning { background: linear-gradient(135deg, #d35400, #f39c12) !important; }
        .toast-info { background: linear-gradient(135deg, #2980b9, #3498db) !important; }
    </style>
</head>
<body>

<header>
    <h1>💊 Remédios</h1>
    <button class="menu-btn" id="btnToggleDrawer" aria-label="Abrir menu">☰</button>
</header>

<div class="container">
    <div id="notifyBanner" class="notify-banner" style="display: none;">
        <span>Ative os lembretes para ser notificado no horário correto.</span>
        <button class="btn-notify-active" id="btnReqNotify">Ativar</button>
    </div>
    <div id="mainList"></div>
</div>

<div class="drawer-overlay" id="drawerOverlay">
    <div class="drawer" id="drawerContainer">
        <div class="tabs">
            <button class="tab-btn active" id="tabAdd">Novo</button>
            <button class="tab-btn" id="tabManage">Gerenciar</button>
            <button class="tab-btn" id="tabSync">Nuvem</button>
        </div>

        <div id="contentAdd">
            <input type="hidden" id="editIndex">
            <div class="form-group">
                <label>Nome do Remédio</label>
                <input type="text" id="medName" placeholder="Ex: Amoxicilina">
            </div>
            <div class="form-group">
                <label>Horário Inicial</label>
                <input type="time" id="medTime">
            </div>
            <div class="form-group">
                <label>Frequência</label>
                <select id="medFreq">
                    <option value="1x">1x ao dia</option>
                    <option value="8h">8 em 8 horas</option>
                    <option value="12h">12 em 12 horas</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Foto da Caixa</label>
                <div class="photo-options">
                    <button type="button" class="btn-photo" id="btnCamera">📷 Câmera</button>
                    <button type="button" class="btn-photo" id="btnGallery">🖼️ Galeria</button>
                </div>
                <input type="file" id="cameraInput" accept="image/*" capture="camera" style="display:none">
                <input type="file" id="galleryInput" accept="image/*" style="display:none">
                <div class="photo-preview" id="photoPreview">
                    <img id="previewImg" src="" alt="Prévia da foto">
                    <button type="button" class="btn-remove-photo" id="btnRemovePhoto">✕</button>
                </div>
            </div>

            <button class="btn btn-add" id="btnSave">Salvar Remédio</button>
        </div>

        <div id="contentManage" style="display:none">
            <div id="manageList"></div>
        </div>

        <div id="contentSync" style="display:none">
            <div class="form-group">
                <label>Chave / ID do Usuário</label>
                <input type="text" id="userCodeInput" placeholder="Ex: mae">
                <small style="color: var(--subtext); display: block; margin-top: 6px; font-size: 12px; line-height: 1.4;">Digite a chave para sincronizar ou restaurar seus dados de outro aparelho.</small>
            </div>
            <button class="btn btn-sync" id="btnSyncCloud">Sincronizar com Nuvem</button>
        </div>
    </div>
</div>

<div class="image-modal" id="imageModal">
    <img id="fullImage" src="" alt="Foto expandida">
</div>

<!-- Modal de Confirmação para Tomar Remédio -->
<div class="confirm-modal-overlay" id="confirmModal">
    <div class="confirm-modal">
        <h3>Confirmar Dose</h3>
        <p>Confirmar que você tomou este medicamento?</p>
        <div class="modal-btns">
            <button class="btn-no" id="btnConfirmNo">Cancelar</button>
            <button class="btn-yes" id="btnConfirmYes">Confirmar</button>
        </div>
    </div>
</div>

<!-- Modal de Confirmação para Exclusão -->
<div class="confirm-modal-overlay" id="deleteModal">
    <div class="confirm-modal">
        <h3>Excluir Remédio</h3>
        <p>Tem certeza que deseja remover este item da lista?</p>
        <div class="modal-btns">
            <button class="btn-no" id="btnDeleteNo">Cancelar</button>
            <button class="btn-danger-confirm" id="btnDeleteYes">Excluir</button>
        </div>
    </div>
</div>

<!-- Toastify JS -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script>
    // --- CONFIGURAÇÃO DO JSONBIN ---
    const JSONBIN_BIN_ID = "6a8b372cda38895dfe078ab0"; 
    const JSONBIN_API_KEY = "$2a$10$7BBk9AA/0h3zZxTwYz9TluPmvrsT3avKvxNoJNPKX3MJfq0oflohy"; 
    const API_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

    // Estado da Aplicação
    let medications = JSON.parse(localStorage.getItem('medications')) || [];
    let userCode = localStorage.getItem('userCode') || 'mae';
    let selectedIndex = null;
    let deleteIndex = null;
    let currentPhotoBase64 = '';

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro SW:', err));
        });
    }

    // --- SISTEMA DE NOTIFICAÇÃO TOAST CUSTOMIZADO ---
    function notify(text, type = 'info') {
        const icons = {
            success: '✅',
            error: '🚨',
            warning: '⚠️',
            info: 'ℹ️'
        };

        Toastify({
            text: `${icons[type] || ''} ${text}`,
            duration: 3000,
            gravity: "top",
            position: "center",
            className: `toast-${type}`,
            stopOnFocus: true
        }).showToast();
    }

    // --- FUNÇÕES DA INTERFACE ---
    function toggleDrawer(open) { document.getElementById('drawerOverlay').classList.toggle('active', open); }

    function switchTab(tab, shouldReset = false) {
        document.getElementById('contentAdd').style.display = tab === 'add' ? 'block' : 'none';
        document.getElementById('contentManage').style.display = tab === 'manage' ? 'block' : 'none';
        document.getElementById('contentSync').style.display = tab === 'sync' ? 'block' : 'none';
        document.getElementById('tabAdd').classList.toggle('active', tab === 'add');
        document.getElementById('tabManage').classList.toggle('active', tab === 'manage');
        document.getElementById('tabSync').classList.toggle('active', tab === 'sync');
        if (tab === 'add' && shouldReset) resetForm();
    }

    function checkNotificationStatus() {
        if ("Notification" in window && Notification.permission === "default") {
            document.getElementById('notifyBanner').style.display = 'flex';
        } else {
            document.getElementById('notifyBanner').style.display = 'none';
        }
    }

    function requestNotificationPermission() {
        if (!("Notification" in window)) return notify("Seu navegador não suporta notificações.", "error");
        Notification.requestPermission().then(permission => {
            checkNotificationStatus();
            if (permission === "granted") {
                notify("Notificações ativadas com sucesso!", "success");
                triggerSystemNotification("Remédios", "As notificações estão configuradas!");
            }
        });
    }

    function triggerSystemNotification(title, body) {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.ready.then(reg => {
                reg.showNotification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/883/883353.png', vibrate: [200, 100, 200] });
            });
        } else if ("Notification" in window && Notification.permission === "granted") {
            new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/883/883353.png' });
        }
    }

    function compressImage(dataUrl, maxWidth, maxHeight, quality, callback) {
        const img = new Image();
        img.src = dataUrl;
        img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } }
            else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', quality));
        };
    }

    function handlePhotoSelect(input) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                compressImage(e.target.result, 350, 350, 0.6, (compressedBase64) => {
                    currentPhotoBase64 = compressedBase64;
                    document.getElementById('previewImg').src = currentPhotoBase64;
                    document.getElementById('photoPreview').style.display = 'block';
                });
            };
            reader.readAsDataURL(file);
        }
    }

    function removePhoto() {
        currentPhotoBase64 = '';
        document.getElementById('previewImg').src = '';
        document.getElementById('photoPreview').style.display = 'none';
        document.getElementById('cameraInput').value = '';
        document.getElementById('galleryInput').value = '';
    }

    function resetForm() {
        document.getElementById('editIndex').value = '';
        document.getElementById('medName').value = '';
        document.getElementById('medTime').value = '';
        document.getElementById('medFreq').value = '1x';
        removePhoto();
    }

    function saveToStorage() { 
        localStorage.setItem('medications', JSON.stringify(medications)); 
        render(); 
        autoUploadToCloud(); 
    }

    function saveMedication() {
        const index = document.getElementById('editIndex').value;
        const name = document.getElementById('medName').value.trim();
        const time = document.getElementById('medTime').value;
        const freq = document.getElementById('medFreq').value;

        if (!name || !time) {
            notify("Informe o nome e o horário do remédio.", "warning");
            return;
        }

        if (index === '') {
            medications.push({ name, time, freq, photo: currentPhotoBase64 || '', taken: false, nextDoseTimestamp: null, lastNotified: null });
            notify("Remédio cadastrado com sucesso!", "success");
        } else { 
            medications[index].name = name; 
            medications[index].time = time; 
            medications[index].freq = freq; 
            if (currentPhotoBase64) medications[index].photo = currentPhotoBase64; 
            notify("Remédio atualizado!", "success");
        }

        saveToStorage(); 
        toggleDrawer(false); 
        resetForm();
    }

    function editMed(index) {
        const m = medications[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('medName').value = m.name;
        document.getElementById('medTime').value = m.time;
        document.getElementById('medFreq').value = m.freq;
        
        if (m.photo) {
            currentPhotoBase64 = m.photo;
            document.getElementById('previewImg').src = m.photo;
            document.getElementById('photoPreview').style.display = 'block';
        } else {
            removePhoto();
        }
        switchTab('add', false);
    }

    function openDeleteModal(index) {
        deleteIndex = index;
        document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('active');
        deleteIndex = null;
    }

    function confirmDelete() {
        if (deleteIndex !== null) {
            medications.splice(deleteIndex, 1);
            saveToStorage();
            notify("Remédio removido.", "info");
            closeDeleteModal();
        }
    }

    function openImageModal(photoUrl, isTaken) {
        if (isTaken || !photoUrl) return;
        document.getElementById('fullImage').src = photoUrl;
        document.getElementById('imageModal').classList.add('active');
    }

    function openConfirmModal(index) { selectedIndex = index; document.getElementById('confirmModal').classList.add('active'); }
    function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('active'); selectedIndex = null; }

    function confirmTake() {
        if (selectedIndex !== null) {
            const m = medications[selectedIndex];
            m.taken = true;
            let nextDate = new Date();
            const [h, min] = m.time.split(':').map(Number);
            nextDate.setHours(h, min, 0, 0);

            if (m.freq === '8h') nextDate.setHours(nextDate.getHours() + 8);
            else if (m.freq === '12h') nextDate.setHours(nextDate.getHours() + 12);
            else nextDate.setDate(nextDate.getDate() + 1);

            m.time = `${String(nextDate.getHours()).padStart(2, '0')}:${String(nextDate.getMinutes()).padStart(2, '0')}`;
            m.nextDoseTimestamp = nextDate.getTime();
            m.lastNotified = null;
            saveToStorage(); 
            closeConfirmModal();
            notify(`Dose de ${m.name} registrada!`, "success");
        }
    }

    // --- CONEXÃO COM O JSONBIN ---
    async function fetchFromCloud(targetCode, isAuto = false) {
        try {
            const response = await fetch(API_URL, {
                method: 'GET',
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });

            if (response.ok) {
                const result = await response.json();
                const allData = result.record || {};
                
                if (allData[targetCode]) {
                    medications = allData[targetCode];
                    localStorage.setItem('medications', JSON.stringify(medications));
                    render();
                    if (!isAuto) notify("Dados sincronizados com a nuvem!", "success");
                } else if (!isAuto) {
                    notify("Nenhum registro encontrado para esta chave.", "warning");
                }
            } else {
                throw new Error('Falha na requisição');
            }
        } catch (err) {
            console.error(err);
            if (!isAuto) notify("Erro ao conectar com a nuvem.", "error");
        }
    }

    async function autoUploadToCloud() {
        if (!userCode) return;
        try {
            const getRes = await fetch(API_URL, {
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            });
            
            let allData = {};
            if (getRes.ok) {
                const getJson = await getRes.json();
                allData = getJson.record || {};
            }

            allData[userCode] = medications;

            await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(allData)
            });
        } catch (e) {
            console.error('Erro ao enviar para a nuvem:', e);
        }
    }

    async function syncWithCloud() {
        const code = document.getElementById('userCodeInput').value.trim();
        if (!code) return notify("Digite uma chave de usuário válida.", "warning");
        userCode = code;
        localStorage.setItem('userCode', userCode);
        await fetchFromCloud(userCode, false);
        toggleDrawer(false);
    }

    function checkReminders() {
        const now = new Date();
        const currentHHMM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const todayKey = now.toDateString();

        medications.forEach(m => {
            if (!m.taken && m.time === currentHHMM && m.lastNotified !== todayKey + '_' + currentHHMM) {
                triggerSystemNotification("Hora do Remédio!", `Está na hora de tomar: ${m.name}`);
                m.lastNotified = todayKey + '_' + currentHHMM;
                localStorage.setItem('medications', JSON.stringify(medications));
            }
        });
    }

    function render() {
        const now = Date.now();
        medications.forEach(m => {
            if (m.taken && m.nextDoseTimestamp && now >= m.nextDoseTimestamp) { 
                m.taken = false; 
                m.nextDoseTimestamp = null; 
            }
        });

        checkReminders();

        const mainContainer = document.getElementById('mainList');
        if (medications.length === 0) {
            mainContainer.innerHTML = `
                <div class="empty-state">
                    <span class="empty-state-icon">📋</span>
                    Nenhum remédio cadastrado.<br>Clique no menu para adicionar.
                </div>`;
        } else {
            mainContainer.innerHTML = medications.map((m, i) => `
                <div class="med-item ${m.taken ? 'taken' : ''}">
                    <img src="${m.photo || 'https://via.placeholder.com/52?text=💊'}" class="med-img" data-index="${i}" alt="${m.name}">
                    <div class="med-info">
                        <b>${m.name}</b>
                        <span>Horário: ${m.time} (${m.freq})</span>
                    </div>
                    <button class="btn-mini btn-take" data-index="${i}" ${m.taken ? 'disabled' : ''}>${m.taken ? '✅ Tomado' : 'Tomar'}</button>
                </div>
            `).join('');
        }

        const manageContainer = document.getElementById('manageList');
        if (medications.length === 0) {
            manageContainer.innerHTML = `<div class="empty-state">Sem itens para gerenciar.</div>`;
        } else {
            manageContainer.innerHTML = medications.map((m, i) => `
                <div class="med-item">
                    <div class="med-info">
                        <b>${m.name}</b>
                        <span>${m.time} - ${m.freq}</span>
                    </div>
                    <button class="btn-mini btn-edit" data-index="${i}" style="background:#fff3cd; color:#856404;">Editar</button>
                    <button class="btn-mini btn-delete" data-index="${i}" style="background:#f8d7da; color:#721c24;">Excluir</button>
                </div>
            `).join('');
        }

        // Binds de eventos aos itens dinâmicos
        document.querySelectorAll('.med-img').forEach(img => {
            img.addEventListener('click', (e) => {
                const idx = e.target.getAttribute('data-index');
                openImageModal(medications[idx].photo, medications[idx].taken);
            });
        });

        document.querySelectorAll('.btn-take').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = e.target.getAttribute('data-index');
                openConfirmModal(idx);
            });
        });

        document.querySelectorAll('.btn-edit').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = e.target.getAttribute('data-index');
                editMed(idx);
            });
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = e.target.getAttribute('data-index');
                openDeleteModal(idx);
            });
        });
    }

    async function initUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const userFromUrl = urlParams.get('user');

        if (userFromUrl) {
            userCode = userFromUrl.trim();
        }

        localStorage.setItem('userCode', userCode);
        document.getElementById('userCodeInput').value = userCode;
        await fetchFromCloud(userCode, true);
    }

    // Eventos Estáticos
    document.getElementById('btnToggleDrawer').addEventListener('click', () => toggleDrawer(true));
    document.getElementById('drawerOverlay').addEventListener('click', () => toggleDrawer(false));
    document.getElementById('drawerContainer').addEventListener('click', (e) => e.stopPropagation());

    document.getElementById('tabAdd').addEventListener('click', () => switchTab('add', true));
    document.getElementById('tabManage').addEventListener('click', () => switchTab('manage'));
    document.getElementById('tabSync').addEventListener('click', () => switchTab('sync'));

    document.getElementById('btnCamera').addEventListener('click', () => document.getElementById('cameraInput').click());
    document.getElementById('btnGallery').addEventListener('click', () => document.getElementById('galleryInput').click());
    document.getElementById('cameraInput').addEventListener('change', function() { handlePhotoSelect(this); });
    document.getElementById('galleryInput').addEventListener('change', function() { handlePhotoSelect(this); });
    document.getElementById('btnRemovePhoto').addEventListener('click', removePhoto);

    document.getElementById('btnSave').addEventListener('click', saveMedication);
    document.getElementById('btnSyncCloud').addEventListener('click', syncWithCloud);
    document.getElementById('btnReqNotify').addEventListener('click', requestNotificationPermission);

    document.getElementById('imageModal').addEventListener('click', function() { this.classList.remove('active'); });
    
    // Binds dos Modais de Confirmação
    document.getElementById('btnConfirmNo').addEventListener('click', closeConfirmModal);
    document.getElementById('btnConfirmYes').addEventListener('click', confirmTake);
    
    document.getElementById('btnDeleteNo').addEventListener('click', closeDeleteModal);
    document.getElementById('btnDeleteYes').addEventListener('click', confirmDelete);

    checkNotificationStatus();
    initUrlParams();
    setInterval(render, 5000);
    render();
</script>

</body>
</html>
